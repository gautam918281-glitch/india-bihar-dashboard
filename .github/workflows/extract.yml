name: Extract project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q india-bihar-COMPLETE.zip -d extracted

          if [ -d "extracted/india-bihar-COMPLETE" ]; then
            cp -a extracted/india-bihar-COMPLETE/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract dashboard project files" || echo "Nothing to commit"
          git push
